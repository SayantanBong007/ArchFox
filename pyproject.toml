[project]
name = "archfox"
version = "0.1.0"
description = "CLI-based code review agent with GitHub integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "openai>=1.30",
    "python-dotenv>=1.0",
    "sentence-transformers>=2.2",
    "gitpython>=3.1",
    "qdrant-client>=1.9",
    "tqdm>=4.66",
    "langgraph>=1.0",
    "tree-sitter>=0.21.3",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.2",
    "tree-sitter-typescript>=0.21.1",
    "tree-sitter-cpp>=0.22.0",
    "tree-sitter-c>=0.21.4",
    "tree-sitter-go>=0.21.2",
    "tree-sitter-java>=0.21.0",
    "tree-sitter-rust>=0.21.2"
]

[project.scripts]
archfox = "apps.cli.main:main"

[tool.setuptools.packages.find]
include = ["apps*", "agents*", "tools*", "prompts*", "configs*", "retrieval*", "analysis*", "graphs*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pyright]
extraPaths = ["."]
exclude = ["data/repos/**"]
