[project]
name = "archfox"
version = "0.1.0"
description = "CLI-based code review agent with GitHub integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "openai>=1.30",
    "python-dotenv>=1.0",
    "sentence-transformers>=2.2",
    "gitpython>=3.1",
    "qdrant-client>=1.9",
    "tqdm>=4.66",
    "langgraph>=1.0"
]

[project.scripts]
archfox = "apps.cli.main:main"

[tool.setuptools.packages.find]
include = ["apps*", "agents*", "tools*", "prompts*", "configs*", "retrieval*", "analysis*", "graphs*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
