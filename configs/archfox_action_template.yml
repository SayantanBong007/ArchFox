name: ArchFox PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    
    # Spin up Neo4j for the Kitsune Knowledge Engine
    services:
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/kitsune_password
          NEO4J_server_default__listen__address: 0.0.0.0
        ports:
          - 7687:7687
    
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        
      - name: Checkout ArchFox
        uses: actions/checkout@v4
        with:
          repository: SayantanBong007/ArchFox
          path: archfox_tool
          
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          cd archfox_tool
          pip install -r requirements.txt
          
      - name: Run ArchFox AI Review
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: kitsune_password
        run: |
          cd archfox_tool
          python apps/cli/main.py review --repo "https://github.com/${{ github.repository }}" --pr ${{ github.event.pull_request.number }}
